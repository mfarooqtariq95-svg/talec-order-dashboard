<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TALEC — Order Messages</title>
<style>
  :root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --muted: #6D6D6D;
    --gold: #E9AC13;
    --gold-light: #FCCF68;
    --green: #1e8e3e;
    --green-bg: #e6f4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card: #1c1c1c;
      --border: #333333;
      --text: #f0f0f0;
      --muted: #a0a0a0;
      --green-bg: #143324;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: #020202;
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    letter-spacing: 0.5px;
  }
  header h1 span { color: var(--gold); }
  .settings-toggle {
    background: none;
    border: 1px solid #555;
    color: #ccc;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #settingsPanel {
    display: none;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    gap: 12px;
    flex-wrap: wrap;
    align-items: end;
  }
  #settingsPanel.open { display: flex; }
  #settingsPanel label {
    display: flex;
    flex-direction: column;
    font-size: 12px;
    color: var(--muted);
    gap: 4px;
  }
  #settingsPanel input {
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    min-width: 260px;
  }
  main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    padding: 8px 18px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  .tab.active { background: var(--gold); border-color: var(--gold); color: #020202; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .toolbar .count { color: var(--muted); font-size: 13px; }
  button.refresh {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 14px; text-align: left; font-size: 14px; vertical-align: top; }
  th {
    background: rgba(233,172,19,0.08);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  tr + tr td { border-top: 1px solid var(--border); }
  .order-id {
    max-width: 140px;
    word-break: break-all;
  }
  .msg-preview {
    max-width: 260px;
    max-height: 60px;
    overflow: hidden;
    color: var(--muted);
    font-size: 12px;
    white-space: pre-line;
  }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn-copy { background: #eee; color: #222; }
  .btn-wa { background: #25D366; color: #fff; }
  @media (prefers-color-scheme: dark) { .btn-copy { background: #333; color: #eee; } }
  .status-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 500;
  }
  .status-btn.sent { background: var(--green-bg); color: var(--green); border-color: var(--green); }

  /* Confirm/Dispatch delivery ticks (2026-08-13) — real per-message status, not just "we
     attempted a send": grey = sent but not yet confirmed reaching the phone, green = confirmed
     delivered/read, red = failed (includes a skipped send, e.g. 24h window closed — either way
     the customer didn't get a message). The whole point is a failure is visible at a glance
     without opening each order. */
  .tick-col { text-align: center; width: 1%; white-space: nowrap; }
  .tick {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 26px; height: 22px; padding: 0 4px; border-radius: 11px;
    font-size: 12px; font-weight: 700; border: 1px solid var(--border);
    color: var(--muted); background: transparent;
  }
  .tick.tick-none { color: var(--border); border-style: dashed; }
  .tick.tick-sent { color: var(--muted); border-color: var(--muted); background: rgba(109,109,109,0.1); }
  .tick.tick-delivered { color: var(--green); border-color: var(--green); background: var(--green-bg); }
  .tick.tick-failed { color: #c62828; border-color: #c62828; background: rgba(198,40,40,0.1); }
  @media (prefers-color-scheme: dark) { .tick.tick-failed { background: rgba(198,40,40,0.2); } }
  .fail-banner {
    display: none;
    background: rgba(198,40,40,0.1); border: 1px solid #c62828; color: #c62828;
    border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 600;
    margin-bottom: 12px;
  }
  .fail-banner.show { display: block; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #020202;
    color: #fff;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  #loginScreen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 60px);
    padding: 20px;
  }
  .login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .login-card h2 { margin: 0 0 4px; font-size: 18px; }
  .login-card label {
    display: flex;
    flex-direction: column;
    font-size: 12px;
    color: var(--muted);
    gap: 4px;
  }
  .login-card input {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
  }
  .login-error {
    color: #c62828;
    font-size: 13px;
    min-height: 16px;
  }
</style>
</head>
<body>

<header>
  <h1>TALEC — <span>Order Messages</span></h1>
  <button class="settings-toggle" id="settingsToggle" style="display:none;">⚙ Setup</button>
</header>

<div id="settingsPanel">
  <label>
    Backend URL
    <input type="text" id="backendUrl" placeholder="https://your-render-app.onrender.com">
  </label>
  <label>
    Access Key
    <input type="password" id="apiKey" placeholder="dashboard access key">
  </label>
  <button class="refresh" id="saveSettings">Save</button>
</div>

<!-- Normal staff entry point: username/password instead of the raw access key.
     Shown whenever this device has no key stored yet and isn't in ?setup=1
     (admin) mode. Submitting trades the credential for the same access key
     Setup would store, then everything downstream is identical. -->
<div id="loginScreen" style="display:none;">
  <div class="login-card">
    <h2>Sign in</h2>
    <label>
      Username
      <input type="text" id="loginUsername" autocomplete="username">
    </label>
    <label>
      Password
      <input type="password" id="loginPassword" autocomplete="current-password">
    </label>
    <button class="btn-wa" id="loginBtn" style="width:100%;padding:10px;">Sign in</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<main id="mainContent" style="display:none;">
  <div class="tabs">
    <button class="tab active" data-stage="confirmation">Order Confirmation</button>
    <button class="tab" data-stage="dispatch">Dispatch</button>
    <button class="tab" data-stage="abandoned">Abandoned Cart</button>
  </div>

  <div class="toolbar">
    <span class="count" id="countLabel"></span>
    <button class="refresh" id="refreshBtn">↻ Refresh</button>
  </div>

  <div class="fail-banner" id="failBanner"></div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Order #</th>
          <th>Customer / Phone</th>
          <th>Price</th>
          <th>Message</th>
          <th>Actions</th>
          <th>Status</th>
          <th class="tick-col" title="Order-confirmation WhatsApp message">Confirm</th>
          <th class="tick-col" title="Dispatch WhatsApp message">Dispatch</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">No orders yet.</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const $ = (sel) => document.querySelector(sel);
  let currentStage = 'confirmation';
  let autoRefreshTimer = null;

  // Falls back to same-origin: when this page and the API share a domain (the
  // orders.talec.pk deploy — Caddy reverse-proxies API paths on that same
  // origin), a fresh device only needs the access key entered once, not the
  // backend URL too. Explicit Setup entry (e.g. the old separate-origin
  // GitHub Pages + Render split) still overrides this.
  function getBackendUrl() { return localStorage.getItem('talec_dash_backend_url') || location.origin; }
  function getApiKey() { return localStorage.getItem('talec_dash_api_key') || ''; }

  function showToast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1600);
  }

  // Setup is hidden from normal use (staff shouldn't see or be tempted to touch the access
  // key). Only reachable via ?setup=1 in the URL, which the admin uses once per device.
  const setupAllowed = new URLSearchParams(location.search).has('setup');

  function openSettings() {
    $('#settingsToggle').style.display = '';
    $('#settingsPanel').classList.add('open');
    $('#backendUrl').value = getBackendUrl();
    $('#apiKey').value = getApiKey();
  }

  if (setupAllowed) {
    $('#settingsToggle').style.display = '';
    if (!getBackendUrl() || !getApiKey()) openSettings();
  }

  $('#settingsToggle').addEventListener('click', () => {
    $('#settingsPanel').classList.toggle('open');
  });

  $('#saveSettings').addEventListener('click', () => {
    localStorage.setItem('talec_dash_backend_url', $('#backendUrl').value.trim().replace(/\/$/, ''));
    localStorage.setItem('talec_dash_api_key', $('#apiKey').value.trim());
    $('#settingsPanel').classList.remove('open');
    showToast('Settings saved');
    showApp();
  });

  document.querySelectorAll('.tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
      tab.classList.add('active');
      currentStage = tab.dataset.stage;
      loadOrders();
    });
  });

  $('#refreshBtn').addEventListener('click', loadOrders);

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ' ' +
           d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  async function loadOrders() {
    const backendUrl = getBackendUrl();
    const apiKey = getApiKey();
    if (!backendUrl || !apiKey) {
      if (setupAllowed) openSettings();
      else showLogin();
      return;
    }
    try {
      const res = await fetch(`${backendUrl}/manual/orders?stage=${currentStage}`, {
        headers: { 'x-api-key': apiKey }
      });
      if (res.status === 401) {
        // Stored key no longer works (revoked/rotated) — drop it and send the
        // rep back to the login screen instead of toasting every 20s forever.
        localStorage.removeItem('talec_dash_api_key');
        if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
        showLogin('Session expired — please sign in again');
        return;
      }
      const data = await res.json();
      renderRows(data.orders || []);
    } catch (err) {
      showToast('Could not reach backend');
      console.error(err);
    }
  }

  // Real per-message delivery tick (2026-08-13) — see server.js recordMessageSend/
  // updateMessageStatus for what sets these. Deliberately distinguishes "we called the API"
  // (grey) from "confirmed reaching the phone" (green) from "customer got nothing" (red) —
  // that distinction is exactly what a real incident (TALEC18277) showed matters.
  function renderTick(status) {
    if (!status) return `<span class="tick tick-none" title="Not applicable yet">–</span>`;
    if (status === 'delivered' || status === 'read') return `<span class="tick tick-delivered" title="Delivered">✓✓</span>`;
    if (status === 'sent') return `<span class="tick tick-sent" title="Sent — not yet confirmed delivered">✓</span>`;
    if (status === 'failed') return `<span class="tick tick-failed" title="Failed — customer did not receive this message">✕</span>`;
    return `<span class="tick tick-none" title="${status}">?</span>`;
  }

  function renderRows(orders) {
    const tbody = $('#rows');
    tbody.innerHTML = '';
    $('#emptyState').style.display = orders.length ? 'none' : 'block';
    $('#countLabel').textContent = orders.length
      ? `${orders.length} order${orders.length === 1 ? '' : 's'} — ${orders.filter(o => !o.sent).length} pending`
      : '';

    // Surface real send failures at the top, not buried in a scrollable table — the whole
    // point of the ticks is catching "the system silently isn't working" at a glance.
    const failCount = orders.filter(o => o.confirmationMsgStatus === 'failed' || o.dispatchMsgStatus === 'failed').length;
    const banner = $('#failBanner');
    if (failCount) {
      banner.textContent = `⚠ ${failCount} order${failCount === 1 ? '' : 's'} on this tab have a message that failed to send — check the ✕ ticks below.`;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }

    for (const order of orders) {
      const tr = document.createElement('tr');

      // api.whatsapp.com (not wa.me) — wa.me has a known bug mangling multi-byte UTF-8
      // (emoji) into "�" replacement characters when it redirects into the native app.
      const waLink = `https://api.whatsapp.com/send?phone=${order.phone}&text=${encodeURIComponent(order.message)}`;

      tr.innerHTML = `
        <td>${fmtDate(order.date)}</td>
        <td class="order-id"><strong>${order.orderName || order.orderId}</strong></td>
        <td>${order.customerName || ''}<br><span style="color:var(--muted);font-size:12px">${order.phone}</span></td>
        <td>${order.price != null ? `Rs ${order.price}` : '—'}</td>
        <td><div class="msg-preview">${order.message}</div></td>
        <td>
          <div class="actions">
            <button class="btn btn-copy" data-action="copy">Copy</button>
            <a class="btn btn-wa" href="${waLink}" target="_blank" rel="noopener">Send via WhatsApp</a>
          </div>
        </td>
        <td>
          <button class="status-btn ${order.sent ? 'sent' : ''}" data-action="toggle">
            ${order.sent ? '✓ Sent' : 'Pending'}
          </button>
        </td>
        <td class="tick-col">${renderTick(order.confirmationMsgStatus)}</td>
        <td class="tick-col">${renderTick(order.dispatchMsgStatus)}</td>
      `;

      tr.querySelector('[data-action="copy"]').addEventListener('click', async () => {
        await navigator.clipboard.writeText(order.message);
        showToast('Message copied');
      });

      tr.querySelector('[data-action="toggle"]').addEventListener('click', async (e) => {
        const nextSent = !order.sent;
        e.target.disabled = true;
        try {
          const res = await fetch(
            `${getBackendUrl()}/manual/orders/${order.orderId}/status`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-api-key': getApiKey() },
              body: JSON.stringify({ stage: currentStage, sent: nextSent })
            }
          );
          if (!res.ok) throw new Error('failed');
          order.sent = nextSent;
          e.target.classList.toggle('sent', nextSent);
          e.target.textContent = nextSent ? '✓ Sent' : 'Pending';
        } catch (err) {
          showToast('Could not update status');
        } finally {
          e.target.disabled = false;
        }
      });

      tbody.appendChild(tr);
    }
  }

  function showLogin(errorMsg) {
    $('#mainContent').style.display = 'none';
    $('#loginScreen').style.display = 'flex';
    $('#loginError').textContent = errorMsg || '';
    if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
  }

  function showApp() {
    $('#loginScreen').style.display = 'none';
    $('#mainContent').style.display = '';
    loadOrders();
    if (!autoRefreshTimer) autoRefreshTimer = setInterval(loadOrders, 20000);
  }

  async function attemptLogin() {
    const username = $('#loginUsername').value.trim();
    const password = $('#loginPassword').value;
    if (!username || !password) {
      $('#loginError').textContent = 'Enter both fields';
      return;
    }
    $('#loginBtn').disabled = true;
    $('#loginError').textContent = '';
    try {
      const res = await fetch(`${getBackendUrl()}/manual/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        $('#loginError').textContent = body.error || 'Sign in failed';
        return;
      }
      const { apiKey } = await res.json();
      localStorage.setItem('talec_dash_api_key', apiKey);
      $('#loginPassword').value = '';
      showApp();
    } catch (err) {
      $('#loginError').textContent = 'Could not reach server';
    } finally {
      $('#loginBtn').disabled = false;
    }
  }

  $('#loginBtn').addEventListener('click', attemptLogin);
  $('#loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
  $('#loginUsername').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#loginPassword').focus(); });

  // Admin Setup (?setup=1) can still hand-enter a raw key directly — bypasses
  // login entirely, useful as a fallback if the username/password path is
  // ever misconfigured. Normal devices (no ?setup=1, no key yet) land on the
  // login screen instead of the old "contact your admin" dead end. In setup
  // mode with no key yet, openSettings() (above) already handled it — don't
  // also show the login screen underneath it.
  if (getApiKey()) {
    showApp();
  } else if (!setupAllowed) {
    showLogin();
  }
</script>

</body>
</html>
