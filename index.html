<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TALEC — Order Messages</title>
<style>
  :root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --muted: #6D6D6D;
    --gold: #E9AC13;
    --gold-light: #FCCF68;
    --green: #1e8e3e;
    --green-bg: #e6f4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card: #1c1c1c;
      --border: #333333;
      --text: #f0f0f0;
      --muted: #a0a0a0;
      --green-bg: #143324;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: #020202;
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    letter-spacing: 0.5px;
  }
  header h1 span { color: var(--gold); }
  .settings-toggle {
    background: none;
    border: 1px solid #555;
    color: #ccc;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #settingsPanel {
    display: none;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    gap: 12px;
    flex-wrap: wrap;
    align-items: end;
  }
  #settingsPanel.open { display: flex; }
  #settingsPanel label {
    display: flex;
    flex-direction: column;
    font-size: 12px;
    color: var(--muted);
    gap: 4px;
  }
  #settingsPanel input {
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    min-width: 260px;
  }
  main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    padding: 8px 18px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  .tab.active { background: var(--gold); border-color: var(--gold); color: #020202; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .toolbar .count { color: var(--muted); font-size: 13px; }
  button.refresh {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 14px; text-align: left; font-size: 14px; vertical-align: top; }
  th {
    background: rgba(233,172,19,0.08);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  tr + tr td { border-top: 1px solid var(--border); }
  .msg-preview {
    max-width: 260px;
    max-height: 60px;
    overflow: hidden;
    color: var(--muted);
    font-size: 12px;
    white-space: pre-line;
  }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn-copy { background: #eee; color: #222; }
  .btn-wa { background: #25D366; color: #fff; }
  @media (prefers-color-scheme: dark) { .btn-copy { background: #333; color: #eee; } }
  .status-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 500;
  }
  .status-btn.sent { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #020202;
    color: #fff;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>TALEC — <span>Order Messages</span></h1>
  <button class="settings-toggle" id="settingsToggle" style="display:none;">⚙ Setup</button>
</header>

<div id="settingsPanel">
  <label>
    Backend URL
    <input type="text" id="backendUrl" placeholder="https://your-render-app.onrender.com">
  </label>
  <label>
    Access Key
    <input type="password" id="apiKey" placeholder="dashboard access key">
  </label>
  <button class="refresh" id="saveSettings">Save</button>
</div>

<main>
  <div class="tabs">
    <button class="tab active" data-stage="confirmation">Order Confirmation</button>
    <button class="tab" data-stage="dispatch">Dispatch</button>
  </div>

  <div class="toolbar">
    <span class="count" id="countLabel"></span>
    <button class="refresh" id="refreshBtn">↻ Refresh</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Order #</th>
          <th>Customer / Phone</th>
          <th>Message</th>
          <th>Actions</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">No orders yet.</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const $ = (sel) => document.querySelector(sel);
  let currentStage = 'confirmation';
  let autoRefreshTimer = null;

  function getBackendUrl() { return localStorage.getItem('talec_dash_backend_url') || ''; }
  function getApiKey() { return localStorage.getItem('talec_dash_api_key') || ''; }

  function showToast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1600);
  }

  // Setup is hidden from normal use (staff shouldn't see or be tempted to touch the access
  // key). Only reachable via ?setup=1 in the URL, which the admin uses once per device.
  const setupAllowed = new URLSearchParams(location.search).has('setup');

  function openSettings() {
    $('#settingsToggle').style.display = '';
    $('#settingsPanel').classList.add('open');
    $('#backendUrl').value = getBackendUrl();
    $('#apiKey').value = getApiKey();
  }

  if (setupAllowed) {
    $('#settingsToggle').style.display = '';
    if (!getBackendUrl() || !getApiKey()) openSettings();
  }

  $('#settingsToggle').addEventListener('click', () => {
    $('#settingsPanel').classList.toggle('open');
  });

  $('#saveSettings').addEventListener('click', () => {
    localStorage.setItem('talec_dash_backend_url', $('#backendUrl').value.trim().replace(/\/$/, ''));
    localStorage.setItem('talec_dash_api_key', $('#apiKey').value.trim());
    $('#settingsPanel').classList.remove('open');
    showToast('Settings saved');
    loadOrders();
  });

  document.querySelectorAll('.tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
      tab.classList.add('active');
      currentStage = tab.dataset.stage;
      loadOrders();
    });
  });

  $('#refreshBtn').addEventListener('click', loadOrders);

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ' ' +
           d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  async function loadOrders() {
    const backendUrl = getBackendUrl();
    const apiKey = getApiKey();
    if (!backendUrl || !apiKey) {
      if (setupAllowed) openSettings();
      else showToast('Not set up on this device yet — contact your admin');
      return;
    }
    try {
      const res = await fetch(`${backendUrl}/manual/orders?stage=${currentStage}`, {
        headers: { 'x-api-key': apiKey }
      });
      if (res.status === 401) {
        showToast('Access key rejected — check Setup');
        return;
      }
      const data = await res.json();
      renderRows(data.orders || []);
    } catch (err) {
      showToast('Could not reach backend');
      console.error(err);
    }
  }

  function renderRows(orders) {
    const tbody = $('#rows');
    tbody.innerHTML = '';
    $('#emptyState').style.display = orders.length ? 'none' : 'block';
    $('#countLabel').textContent = orders.length
      ? `${orders.length} order${orders.length === 1 ? '' : 's'} — ${orders.filter(o => !o.sent).length} pending`
      : '';

    for (const order of orders) {
      const tr = document.createElement('tr');

      // api.whatsapp.com (not wa.me) — wa.me has a known bug mangling multi-byte UTF-8
      // (emoji) into "�" replacement characters when it redirects into the native app.
      const waLink = `https://api.whatsapp.com/send?phone=${order.phone}&text=${encodeURIComponent(order.message)}`;

      tr.innerHTML = `
        <td>${fmtDate(order.date)}</td>
        <td><strong>${order.orderName || order.orderId}</strong></td>
        <td>${order.customerName || ''}<br><span style="color:var(--muted);font-size:12px">${order.phone}</span></td>
        <td><div class="msg-preview">${order.message}</div></td>
        <td>
          <div class="actions">
            <button class="btn btn-copy" data-action="copy">Copy</button>
            <a class="btn btn-wa" href="${waLink}" target="_blank" rel="noopener">Send via WhatsApp</a>
          </div>
        </td>
        <td>
          <button class="status-btn ${order.sent ? 'sent' : ''}" data-action="toggle">
            ${order.sent ? '✓ Sent' : 'Pending'}
          </button>
        </td>
      `;

      tr.querySelector('[data-action="copy"]').addEventListener('click', async () => {
        await navigator.clipboard.writeText(order.message);
        showToast('Message copied');
      });

      tr.querySelector('[data-action="toggle"]').addEventListener('click', async (e) => {
        const nextSent = !order.sent;
        e.target.disabled = true;
        try {
          const res = await fetch(
            `${getBackendUrl()}/manual/orders/${order.orderId}/status`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-api-key': getApiKey() },
              body: JSON.stringify({ stage: currentStage, sent: nextSent })
            }
          );
          if (!res.ok) throw new Error('failed');
          order.sent = nextSent;
          e.target.classList.toggle('sent', nextSent);
          e.target.textContent = nextSent ? '✓ Sent' : 'Pending';
        } catch (err) {
          showToast('Could not update status');
        } finally {
          e.target.disabled = false;
        }
      });

      tbody.appendChild(tr);
    }
  }

  loadOrders();
  autoRefreshTimer = setInterval(loadOrders, 20000);
</script>

</body>
</html>
